name: Image check

# One cheap image call to diagnose the OpenAI image API (credits, limits, model access).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Call the image API once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python image_check.py
