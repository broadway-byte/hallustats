name: Weekly Generate

on:
  schedule:
    - cron: "0 10 * * 1"   # Monday 10:00 UTC = 6:00 AM ET
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Lahman names
        run: python setup_lahman.py

      - name: Generate player batch
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY:      ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID:  ${{ secrets.NOTION_DATABASE_ID }}
          CLAUDE_DRAFT_MODEL:  ${{ secrets.CLAUDE_DRAFT_MODEL }}   # optional override
          CLAUDE_CRITIC_MODEL: ${{ secrets.CLAUDE_CRITIC_MODEL }}  # optional override
        run: |
          set -o pipefail
          python generate_batch.py 2>&1 | tee run.log

      - name: Show error
        if: failure()
        run: |
          echo "::error::$(tail -c 1500 run.log 2>/dev/null | tr '\n' ' ')"
